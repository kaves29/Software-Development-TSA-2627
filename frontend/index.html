<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Speakly · Practice studio</title>
  <link rel="stylesheet" href="./styles.css">
  <script type="module" src="./app.js"></script>
</head>
<body>
  <div class="shell">
    <main id="screen" tabindex="-1"></main>
    <nav class="bottom-nav" aria-label="Main navigation">
      <a href="#home"><span aria-hidden="true">⌂</span><span>Home</span></a>
      <a href="#presentation"><span aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="13" rx="1"/><path d="M12 17v3m-4 1 4-1 4 1M7 8h10M7 11h6"/></svg></span><span>Presentation</span></a>
      <a href="#interview"><span aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M6 11a6 6 0 0 0 12 0M12 17v4m-3 0h6"/></svg></span><span>Interview</span></a>
      <a href="#roadmap"><span aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="5" cy="18" r="2"/><circle cx="19" cy="6" r="2"/><path d="M7 18h5a3 3 0 0 0 0-6h-1a3 3 0 0 1 0-6h6"/></svg></span><span>Roadmap</span></a>
    </nav>
  </div>
  <template id="home">
    <section class="goal-hero">
      <div class="greeting">
        <div><h1 id="greeting">Hello, speaker!</h1><p>Keep working toward your speaking goals.</p></div>
        <button class="profile" id="edit-profile" type="button" aria-label="Open account">S</button>
      </div>
      <div class="goal-carousel"><button type="button" id="goal-prev" class="goal-nav" aria-label="Previous goal">‹</button><button class="goal-ring" id="edit-goal" type="button">
        <span class="goal-label">Your goal</span>
        <strong id="goal-value">—</strong>
        <span id="goal-caption">Choose your target day</span>
      </button><button type="button" id="goal-next" class="goal-nav" aria-label="Next goal">›</button></div>
      <p id="goal-position" class="goal-position"></p>
      <div class="week-heading"><span>This week</span><span>Practice days</span></div>
      <ol class="week-strip" id="week-strip" aria-label="Practice days this week"></ol>
    </section>
    <section class="dashboard-sheet" aria-labelledby="practice-heading">
      <div class="sheet-hint" aria-hidden="true">⌃</div>
      <div class="sheet-heading"><div><h2 id="practice-heading"></h2><p id="today-date"></p></div><button type="button" id="calendar-open" class="calendar-open" aria-label="Choose session date"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4m10-4v4M3 10h18M7 14h.01M12 14h.01M17 14h.01M7 18h.01M12 18h.01"/></svg></button></div>
      <div id="session-list" class="session-list"></div>
      <button id="add-session" class="add-session" type="button">＋ Add another session</button>
      <p id="session-limit" class="session-limit" hidden>Maximum of five sessions</p>
      <details class="progress-box">
        <summary>Progress</summary>
        <dl class="stats">
          <div><dt>Days practiced</dt><dd id="practice-days">0</dd></div>
          <div><dt>Saved recordings</dt><dd>0</dd></div>
        </dl>
        <h3>Skills you’ve improved</h3>
        <p id="improved-skills"></p>
        <div id="skill-bars"></div>
        <p class="note">Skill levels are self-reported.</p>
      </details>
    </section>
    <dialog id="session-dialog" aria-labelledby="session-dialog-title">
      <form method="dialog" id="session-form">
        <h2 id="session-dialog-title">Edit session</h2>
        <label>Session name <input name="sessionName" maxlength="80" required></label>
        <label>Practice type
          <select name="sessionType">
            <option value="">Choose a type</option>
            <option value="presentation">Presentation</option>
            <option value="interview">Interview</option>
            <option value="roadmap">Roadmap</option>
          </select>
        </label>
        <label>Description <textarea name="sessionDescription" rows="3" maxlength="500"></textarea></label>
        <label>Date <input type="text" name="sessionDate" readonly required aria-label="Date" class="date-field" placeholder="Choose a date"></label>
        <div class="fields"><label>Start time (optional) <input type="text" name="startTime" readonly class="time-field" aria-label="Start time (optional)"></label><label>End time (optional) <input type="text" name="endTime" readonly class="time-field" aria-label="End time (optional)"></label></div>
        <div class="dialog-actions">
          <button type="button" id="delete-session" class="delete-session">Delete</button>
          <button value="save">Done</button>
        </div>
      </form>
    </dialog>
    <dialog id="goal-dialog">
      <form method="dialog">
        <h2>Set your goal date</h2>
        <label>Goal name <input name="goalName" maxlength="60"></label>
        <label>Target date <input name="target" type="text" readonly required aria-label="Target date" class="date-field" placeholder="Choose a date"></label>
        <div class="dialog-actions">
          <button value="remove" formnovalidate>Remove goal</button>
          <button value="cancel" formnovalidate>Cancel</button>
          <button value="save">Save date</button>
        </div>
      </form>
    </dialog>
    <dialog id="calendar-dialog" aria-labelledby="calendar-title">
      <p class="calendar-kicker">Choose a date</p><div class="calendar-header"><button type="button" id="month-prev" aria-label="Previous month">‹</button><h2 id="calendar-title"></h2><button type="button" id="month-next" aria-label="Next month">›</button></div>
      <div class="calendar-grid" id="calendar-grid"></div>
    </dialog>
    <dialog id="time-dialog" aria-labelledby="time-title">
      <form method="dialog" id="time-form">
        <h2 id="time-title">Choose a time</h2>
        <div class="time-picker">
          <label>Hour <select name="hour" aria-label="Hour"></select></label>
          <label>Minute <select name="minute" aria-label="Minute"></select></label>
          <label>Period <select name="period" aria-label="Period"><option>AM</option><option>PM</option></select></label>
        </div>
        <div class="dialog-actions">
          <button value="clear" formnovalidate>Clear</button>
          <button value="cancel" formnovalidate>Cancel</button>
          <button value="save">Set time</button>
        </div>
      </form>
    </dialog>
    <dialog id="profile-dialog">
      <form method="dialog">
        <h2>Edit your greeting</h2>
        <label>Display name <input name="displayName" maxlength="40" autocomplete="given-name"></label>
        <div class="dialog-actions">
          <button value="cancel">Cancel</button><button value="save">Save name</button>
        </div>
      </form>
    </dialog>
  </template>
  <template id="account">
    <section class="account-page">
      <a href="#home" class="account-back">‹ <span>Dashboard</span></a>
      <h1>My account</h1>
      <form id="account-form">
        <div class="avatar-editor">
          <label class="avatar-preview" for="avatar-file"><span id="avatar-initial">S</span><img id="avatar-image" alt="" hidden></label>
          <label for="avatar-file" class="avatar-link">Change photo</label>
          <input id="avatar-file" type="file" accept="image/*" hidden>
          <button id="remove-avatar" type="button" class="text-button">Remove photo</button>
          <div id="crop-controls" class="crop-controls" hidden>
            <p>Adjust your photo</p>
            <label>Zoom <input type="range" id="crop-zoom" min="1" max="3" step=".05" value="1"></label>
            <label>Move left or right <input type="range" id="crop-x" min="0" max="100" value="50"></label>
            <label>Move up or down <input type="range" id="crop-y" min="0" max="100" value="50"></label>
            <button type="button" id="crop-apply" class="secondary">Apply photo</button>
          </div>
        </div>
        <label>Name <input name="name" autocomplete="given-name" maxlength="40"></label>
        <label>Username <input name="username" autocomplete="username" maxlength="40"></label>
        <label>Email address <input name="email" type="email" autocomplete="email" maxlength="254"></label>
        <label>Phone number <input name="phone" type="tel" autocomplete="tel" maxlength="30"></label>
        <label>Recovery email <input name="recoveryEmail" type="email" maxlength="254"></label>
        <button type="submit">Save changes</button>
        <p id="account-status" role="status" class="account-note">Profile details are saved in this browser on this device.</p>
      </form>
      <div class="account-links">
        <a href="#settings"><span>Settings</span><span>›</span></a>
        <a href="#privacy"><span>Privacy</span><span>›</span></a>
      </div>
      <section class="account-actions">
        <button disabled>Sign out</button>
        <button disabled>Delete account permanently</button>
        <p>Account sign-in and deletion will be available when accounts are connected.</p>
      </section>
    </section>
  </template>
  <template id="settings">
    <section class="account-page"><a href="#account" class="account-back">‹ <span>Account</span></a>
      <h1>Settings</h1>
      <div class="settings-card">
        <label>Interview speaker voice
          <select disabled><option>Not available yet</option></select>
        </label>
        <p>Voice selection will be available when interview speech is added.</p>
      </div>
    </section>
  </template>
  <template id="privacy">
    <section class="account-page"><a href="#account" class="account-back">‹ <span>Account</span></a>
      <h1>Privacy</h1>
      <div class="settings-card">
        <h2>Recordings</h2>
        <p>Presentation audio is available for review during the session and is not saved after you leave.</p>
        <label>Save recordings after leaving <select disabled><option>Not available yet</option></select></label>
      </div>
      <div class="settings-card">
        <h2>Device access</h2>
        <p>Choose what Speakly may request. Your browser controls device permissions.</p>
        <label class="permission-row"><span>Microphone</span><input type="checkbox" id="microphone-access" role="switch"></label>
        <label class="permission-row"><span>Camera</span><input type="checkbox" id="camera-access" role="switch"></label>
        <label class="gallery-choice">Photo library
          <select id="photo-access"><option value="none">None</option><option value="selected">Selected photos</option><option value="all">All photos</option></select>
        </label>
        <p>In a browser, photos are accessed only when you select files.</p>
      </div>
    </section>
  </template>
  <template id="roadmap">
    <section class="roadmap-page">
      <a class="account-back" href="#home">‹ <span>Dashboard</span></a>
      <h1>Your roadmap</h1>
      <p class="roadmap-intro">Your path will take shape as you practice.</p>
      <div class="map-frame" id="map-frame" tabindex="0" role="region" aria-label="Vertical roadmap. Scroll or drag to explore.">
        <div id="map-canvas" class="travel-map"></div>
      </div>
      <p class="map-hint">Scroll or drag to explore the route</p>
      <section class="roadmap-progress">
        <h2>Your progress</h2>
        <div class="roadmap-stat"><span>Sections completed</span><strong id="completed-count">0 / 9</strong></div>
        <p>Complete all three prompts in a section to mark it complete.</p>
      </section>
      <section class="roadmap-skills">
        <h2>Skills</h2><p>Example levels for the design preview. These are not quiz results.</p>
        <div class="skill-chart" aria-label="Example skill levels">
          <div><span style="height:58%"></span><small>Pacing</small></div>
          <div><span style="height:76%"></span><small>Clarity</small></div>
          <div><span style="height:43%"></span><small>Structure</small></div>
          <div><span style="height:65%"></span><small>Fluency</small></div>
        </div>
      </section>
      <section class="retake-section"><h2>Check in with your goals</h2><p>Answer five short questions to update your practice preferences.</p><a href="#retake" class="button">Retake quick quiz</a></section>
    </section>
  </template>
  <template id="section-practice">
    <section class="account-page"><a href="#roadmap" class="account-back">‹ <span>Roadmap</span></a>
      <p id="section-region" class="section-region"></p><h1 id="section-title"></h1>
      <p>Take your time with each prompt. Your responses stay in this browser.</p>
      <form id="section-form"><div id="section-questions"></div><button>Complete section</button></form>
    </section>
  </template>
  <template id="retake">
    <section class="account-page"><a href="#roadmap" class="account-back">‹ <span>Roadmap</span></a>
      <h1>Quick check-in</h1><p>Tell us what you want to practice. You can change your answers later.</p>
      <form id="retake-form"><div id="retake-questions"></div><button>Save answers</button><p id="quiz-status" role="status"></p></form>
    </section>
  </template>
  <template id="presentation">
    <a class="back" href="#home">← Home</a>
    <h1>Presentation setup</h1>
    <form>
      <label>Practice format
        <select name="format">
          <option value="random">Random topic</option>
          <option value="prepared">Prepared presentation</option>
          <option value="assignment">Presentation assignment</option>
        </select>
      </label>
      <div id="random-settings">
        <label>Topic category
          <select name="category"><option>Technology and AI</option><option>Education</option><option>Society and culture</option><option>Environment</option><option>Business</option><option>Personal experiences</option><option>Current events</option></select>
        </label>
        <label>Suggested topic <textarea name="suggestion" rows="3" maxlength="240" required></textarea></label>
        <button type="button" id="another-topic" class="secondary">Suggest another topic</button>
        <p class="note">Edit the suggestion to make it more specific.</p>
      </div>
      <label id="topic-field" hidden>Topic <input name="topic" maxlength="240"></label>
      <div class="fields">
        <label>Duration
          <select name="duration">
            <option value="60">1 minute</option><option value="180" selected>3 minutes</option>
            <option value="300">5 minutes</option><option value="600">10 minutes</option><option value="900">15 minutes</option>
          </select>
        </label>
        <label>Prep time
          <select name="prep">
            <option value="0">None</option><option value="30">30 seconds</option>
            <option value="60">1 minute</option><option value="180">3 minutes</option>
          </select>
        </label>
      </div>
      <div class="fields">
        <label>Difficulty <select name="difficulty"><option>Beginner</option><option>Intermediate</option><option>Advanced</option></select></label>
        <label>Presentation style <select name="style"><option>Informative</option><option>Persuasive</option><option>Argumentative</option><option>Explanatory</option></select></label>
      </div>
      <label>Audience
        <select name="audience"><option>Classroom</option><option>Professional</option><option>General</option></select>
      </label>
      <label>Slides PDF (optional) <input type="file" name="slides" accept=".pdf,application/pdf"></label>
      <p class="note">Your PDF opens locally during practice. You can choose to record audio during your rehearsal.</p>
      <button>Start rehearsal</button>
    </form>
  </template>
  <template id="interview">
    <a class="back" href="#home">← Home</a>
    <h1>Mock interview setup</h1>
    <form>
      <label>Question source
        <select name="source"><option value="sample">Sample question</option><option value="own">My question</option></select>
      </label>
      <label id="question-field" hidden>Your question <textarea name="question" rows="3" maxlength="500"></textarea></label>
      <p class="note">Answer out loud at your own pace. This rehearsal uses a timer and does not record.</p>
      <button>Start interview</button>
    </form>
  </template>
  <template id="practice">
    <section class="practice">
      <p class="eyebrow" id="practice-mode"></p>
      <h1 id="prompt"></h1>
      <p id="audience"></p>
      <p id="practice-details"></p>
      <a id="slides" hidden target="_blank" rel="noopener noreferrer">Open slides in a new tab ↗</a>
      <div id="recording-controls" hidden>
        <p id="recording-status" role="status" aria-live="polite">Microphone is off.</p>
        <button id="record-audio" type="button" class="secondary">Start recording</button>
      </div>
      <p id="timer-label"></p>
      <p class="timer" id="timer"></p>
      <button id="advance" type="button">Finish practice</button>
    </section>
  </template>
  <template id="summary">
    <section class="practice">
      <p class="eyebrow">Session complete</p>
      <h1>Practice finished</h1>
      <p id="elapsed"></p>
      <div id="recording-review" hidden><p>Your recording</p><audio controls></audio></div>
      <a class="button" id="practice-again">Practice again</a>
      <a class="back" href="#home">Back to home</a>
    </section>
  </template>
</body>
</html>
